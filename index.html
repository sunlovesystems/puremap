<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PureMap — Curated Organic & Healthy Food Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F3EE;
    --bg-card: #FFFFFF;
    --text-primary: #2C2416;
    --text-secondary: #7A6F60;
    --text-muted: #A89E8E;
    --accent-green: #4A7C59;
    --accent-green-light: #6B9E78;
    --accent-green-bg: #E8F0E4;
    --accent-amber: #C4883A;
    --accent-amber-bg: #FDF3E4;
    --accent-red: #B85C4A;
    --border: #E5DFD4;
    --shadow-sm: 0 1px 3px rgba(44,36,22,0.06);
    --shadow-md: 0 4px 16px rgba(44,36,22,0.08);
    --shadow-lg: 0 8px 32px rgba(44,36,22,0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-pill: 100px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
  }

  /* ── HEADER ── */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(246,243,238,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 24px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .logo-icon {
    width: 34px;
    height: 34px;
    background: var(--accent-green);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
    position: relative;
    overflow: hidden;
  }

  .logo-icon::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15));
  }

  .logo-text {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }

  .logo-tag {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-left: 4px;
  }

  .header-center {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 0 24px;
  }

  .search-bar {
    position: relative;
    width: 100%;
    max-width: 480px;
  }

  .search-bar input {
    width: 100%;
    height: 40px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 0 16px 0 40px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-primary);
    background: var(--bg-card);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-bar input::placeholder { color: var(--text-muted); }
  .search-bar input:focus {
    border-color: var(--accent-green);
    box-shadow: 0 0 0 3px rgba(74,124,89,0.1);
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 15px;
    pointer-events: none;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn {
    height: 36px;
    padding: 0 16px;
    border-radius: var(--radius-pill);
    border: 1.5px solid var(--border);
    background: var(--bg-card);
    color: var(--text-primary);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn:hover { border-color: var(--accent-green); color: var(--accent-green); }

  .btn-primary {
    background: var(--accent-green);
    color: white;
    border-color: var(--accent-green);
  }

  .btn-primary:hover {
    background: var(--accent-green-light);
    border-color: var(--accent-green-light);
    color: white;
  }

  /* ── CITY SWITCHER ── */
  .city-bar {
    position: fixed;
    top: 64px;
    left: 0;
    right: 0;
    z-index: 999;
    background: rgba(246,243,238,0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .city-bar::-webkit-scrollbar { display: none; }

  .city-chip {
    height: 30px;
    padding: 0 14px;
    border-radius: var(--radius-pill);
    border: 1.5px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .city-chip:hover { color: var(--text-primary); background: rgba(0,0,0,0.03); }

  .city-chip.active {
    background: var(--accent-green);
    color: white;
    border-color: var(--accent-green);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    position: fixed;
    top: 108px;
    left: 0;
    bottom: 0;
    width: 380px;
    z-index: 800;
    background: var(--bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .filter-section {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }

  .filter-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .filter-chip {
    height: 30px;
    padding: 0 12px;
    border-radius: var(--radius-pill);
    border: 1.5px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .filter-chip:hover { border-color: var(--accent-green); color: var(--accent-green); }

  .filter-chip.active {
    background: var(--accent-green-bg);
    border-color: var(--accent-green);
    color: var(--accent-green);
  }

  .filter-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .results-header {
    padding: 14px 20px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .results-count {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
  }

  .sort-btn {
    font-size: 12px;
    color: var(--text-secondary);
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
  }

  /* ── PLACE CARDS ── */
  .place-list {
    padding: 4px 12px 24px;
  }

  .place-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .place-card:hover {
    border-color: var(--accent-green);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  .place-card.active {
    border-color: var(--accent-green);
    box-shadow: 0 0 0 2px rgba(74,124,89,0.15), var(--shadow-md);
  }

  .place-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 6px;
  }

  .place-name {
    font-family: 'DM Serif Display', serif;
    font-size: 16px;
    line-height: 1.3;
    color: var(--text-primary);
  }

  .organic-badge {
    flex-shrink: 0;
    height: 22px;
    padding: 0 8px;
    border-radius: var(--radius-pill);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }

  .badge-full { background: var(--accent-green-bg); color: var(--accent-green); }
  .badge-mostly { background: #E4ECF0; color: #4A7088; }
  .badge-some { background: var(--accent-amber-bg); color: var(--accent-amber); }

  .place-type {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    margin-bottom: 6px;
  }

  .place-address {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .place-notes {
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.5;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    font-style: italic;
  }

  .place-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .place-meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .verified-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-green);
  }

  .stale-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-amber);
  }

  /* ── MAP ── */
  .map-container {
    position: fixed;
    top: 108px;
    left: 380px;
    right: 0;
    bottom: 0;
    z-index: 700;
  }

  #map { width: 100%; height: 100%; }

  /* Leaflet overrides */
  .leaflet-control-zoom { border: 1px solid var(--border) !important; border-radius: var(--radius-sm) !important; overflow: hidden; box-shadow: var(--shadow-sm) !important; }
  .leaflet-control-zoom a { background: var(--bg-card) !important; color: var(--text-secondary) !important; width: 34px !important; height: 34px !important; line-height: 34px !important; font-size: 16px !important; border-bottom: 1px solid var(--border) !important; }
  .leaflet-control-zoom a:hover { background: var(--bg) !important; }

  /* Custom markers */
  .custom-marker {
    width: 32px;
    height: 32px;
    border-radius: 50% 50% 50% 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transform: rotate(-45deg);
    transition: transform 0.15s;
    cursor: pointer;
    border: 2px solid white;
  }

  .custom-marker:hover { transform: rotate(-45deg) scale(1.15); }

  .custom-marker span {
    transform: rotate(45deg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .marker-grocery { background: var(--accent-green); }
  .marker-restaurant { background: var(--accent-amber); }
  .marker-juice { background: #7B5EA7; }
  .marker-cafe { background: #B85C4A; }

  /* Popup */
  .leaflet-popup-content-wrapper {
    border-radius: var(--radius) !important;
    box-shadow: var(--shadow-lg) !important;
    border: 1px solid var(--border);
    padding: 0 !important;
  }
  .leaflet-popup-content { margin: 0 !important; min-width: 240px; }
  .leaflet-popup-tip { border-top-color: var(--bg-card); }

  .popup-inner { padding: 16px; }
  .popup-name { font-family: 'DM Serif Display', serif; font-size: 16px; margin-bottom: 4px; }
  .popup-address { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
  .popup-notes { font-size: 12px; color: var(--text-secondary); line-height: 1.4; font-style: italic; padding: 6px 8px; background: var(--bg); border-radius: 6px; margin-bottom: 8px; }
  .popup-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 10px; }

  /* ── DETAIL PANEL ── */
  .detail-panel {
    position: fixed;
    top: 108px;
    right: 0;
    bottom: 0;
    width: 360px;
    z-index: 850;
    background: var(--bg-card);
    border-left: 1px solid var(--border);
    box-shadow: -4px 0 24px rgba(44,36,22,0.06);
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .detail-panel.open { transform: translateX(0); }

  .detail-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--bg);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .detail-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  .detail-name {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    margin-bottom: 4px;
    padding-right: 36px;
  }

  .detail-type { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }

  .detail-body { padding: 16px 20px; }

  .detail-section { margin-bottom: 18px; }

  .detail-section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .detail-text { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }

  .detail-address-text { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }

  .report-btn {
    width: 100%;
    height: 40px;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .report-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .sidebar { width: 320px; }
    .map-container { left: 320px; }
    .logo-tag { display: none; }
  }

  @media (max-width: 700px) {
    .sidebar { display: none; }
    .map-container { left: 0; }
    .header-center { display: none; }
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .place-card { animation: fadeInUp 0.3s ease both; }
  .place-card:nth-child(2) { animation-delay: 0.04s; }
  .place-card:nth-child(3) { animation-delay: 0.08s; }
  .place-card:nth-child(4) { animation-delay: 0.12s; }
  .place-card:nth-child(5) { animation-delay: 0.16s; }
  .place-card:nth-child(6) { animation-delay: 0.20s; }
  .place-card:nth-child(7) { animation-delay: 0.24s; }
  .place-card:nth-child(8) { animation-delay: 0.28s; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <div class="logo-icon">🌿</div>
    <span class="logo-text">PureMap</span>
    <span class="logo-tag">curated organic</span>
  </div>
  <div class="header-center">
    <div class="search-bar">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search places, neighborhoods..." />
    </div>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="showAddModal()">＋ Suggest a Place</button>
    <button class="btn btn-primary" id="statsBtn">📊 Stats</button>
  </div>
</header>

<!-- CITY BAR -->
<nav class="city-bar" id="cityBar">
  <button class="city-chip active" data-city="nyc">New York City</button>
  <button class="city-chip" data-city="nj">New Jersey</button>
  <button class="city-chip" data-city="dc">DC Metro</button>
  <button class="city-chip" data-city="chicago">Chicago</button>
  <button class="city-chip" data-city="la">LA Metro</button>
  <button class="city-chip" data-city="sf">SF Bay Area</button>
  <button class="city-chip" data-city="philly">Philadelphia</button>
</nav>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <!-- Filters: Type -->
  <div class="filter-section">
    <div class="filter-label">Type</div>
    <div class="filter-chips" id="typeFilters">
      <button class="filter-chip active" data-type="all">All</button>
      <button class="filter-chip" data-type="grocery"><span class="filter-dot" style="background:var(--accent-green)"></span>Grocery</button>
      <button class="filter-chip" data-type="restaurant"><span class="filter-dot" style="background:var(--accent-amber)"></span>Restaurant</button>
      <button class="filter-chip" data-type="juice"><span class="filter-dot" style="background:#7B5EA7"></span>Juice Bar</button>
      <button class="filter-chip" data-type="cafe"><span class="filter-dot" style="background:#B85C4A"></span>Café</button>
    </div>
  </div>

  <!-- Filters: Organic Level -->
  <div class="filter-section">
    <div class="filter-label">Organic Level</div>
    <div class="filter-chips" id="levelFilters">
      <button class="filter-chip active" data-level="all">All</button>
      <button class="filter-chip" data-level="full">🌿 Fully Organic</button>
      <button class="filter-chip" data-level="mostly">Mostly Organic</button>
      <button class="filter-chip" data-level="some">Has Organic Options</button>
    </div>
  </div>

  <!-- Results -->
  <div class="results-header">
    <span class="results-count" id="resultsCount">0 places</span>
    <button class="sort-btn">Sort: Name ▾</button>
  </div>

  <div class="place-list" id="placeList"></div>
</aside>

<!-- MAP -->
<div class="map-container">
  <div id="map"></div>
</div>

<!-- DETAIL PANEL -->
<div class="detail-panel" id="detailPanel">
  <button class="detail-close" onclick="closeDetail()">✕</button>
  <div class="detail-header">
    <div class="detail-name" id="detailName"></div>
    <div class="detail-type" id="detailType"></div>
    <div id="detailBadge"></div>
  </div>
  <div class="detail-body">
    <div class="detail-section">
      <div class="detail-section-title">Address</div>
      <div class="detail-address-text" id="detailAddress"></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Neighborhood</div>
      <div class="detail-text" id="detailNeighborhood"></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Notes</div>
      <div class="detail-text" id="detailNotes"></div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Hours</div>
      <div class="detail-text" id="detailHours"></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Verified</div>
      <div class="detail-text" id="detailVerified"></div>
    </div>
    <div class="detail-section" style="margin-top: 24px;">
      <button class="report-btn" onclick="alert('Thank you! We'll investigate this report.')">⚑ Report a Problem (closed, wrong hours, etc.)</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>

// ═══════════════════════════════════════════════════════
//  GOOGLE SHEETS LOADER
// ═══════════════════════════════════════════════════════
let PLACES = [];

function parseSheetRow(row) {
  const type = (row.type || '').trim();
  const status = (row.status || 'active').trim();
  if (status === 'closed') return null;
  const lat = parseFloat(row.latitude);
  const lng = parseFloat(row.longitude);
  if (isNaN(lat) || isNaN(lng)) return null;
  if (!row.name) return null;

  let verified = row.verified_date || '2026-01-01';
  // Handle various date formats from sheets
  if (verified instanceof Date) {
    verified = verified.toISOString().split('T')[0];
  }

  return {
    id: parseInt(row.id) || 0,
    name: (row.name || '').trim(),
    type: type === 'juice_bar' ? 'juice' : type,
    level: (row.organic_level || 'some').trim(),
    city: (row.city_region || 'nyc').trim(),
    neighborhood: (row.neighborhood || '').trim(),
    address: (row.address || '').trim(),
    lat: lat,
    lng: lng,
    notes: (row.notes || '').trim(),
    hours: (row.hours || '').trim(),
    verified: verified.toString().trim()
  };
}

async function loadPlaces() {
  // Show loading state
  const list = document.getElementById('placeList');
  list.innerHTML = '<div style="padding:40px 20px;text-align:center;"><div style="font-size:24px;margin-bottom:8px;">🌿</div><div style="font-size:13px;color:var(--text-muted);">Loading places...</div></div>';

  if (GOOGLE_SHEET_ID === 'YOUR_SHEET_ID_HERE') {
    console.log('No Google Sheet ID configured — using fallback data');
    PLACES = FALLBACK_PLACES;
    renderAll();
    return;
  }

  try {
    const response = await fetch(SHEET_CSV_URL);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const csvText = await response.text();

    const parsed = Papa.parse(csvText, {
      header: true,
      skipEmptyLines: true,
      dynamicTyping: false
    });

    const places = parsed.data.map(parseSheetRow).filter(p => p !== null);

    if (places.length === 0) {
      console.warn('No valid places parsed from sheet — using fallback');
      PLACES = FALLBACK_PLACES;
    } else {
      console.log(`Loaded ${places.length} places from Google Sheets`);
      PLACES = places;
    }
  } catch (err) {
    console.error('Failed to load from Google Sheets:', err);
    console.log('Using fallback data');
    PLACES = FALLBACK_PLACES;
  }

  renderAll();
}

// City centers
const CITIES = {
  nyc: { lat: 40.735, lng: -73.99, zoom: 13, name: "New York City" },
  nj: { lat: 40.22, lng: -74.76, zoom: 9, name: "New Jersey" },
  dc: { lat: 38.91, lng: -77.04, zoom: 11, name: "DC Metro" },
  chicago: { lat: 41.88, lng: -87.63, zoom: 12, name: "Chicago" },
  la: { lat: 34.05, lng: -118.35, zoom: 11, name: "LA Metro" },
  sf: { lat: 37.58, lng: -122.15, zoom: 10, name: "SF Bay Area" },
  philly: { lat: 39.95, lng: -75.17, zoom: 12, name: "Philadelphia" }
};

// ═══════════════════════════════════════
//  MAP INITIALIZATION
// ═══════════════════════════════════════
const map = L.map('map', {
  zoomControl: false
}).setView([40.735, -73.99], 13);

L.control.zoom({ position: 'topright' }).addTo(map);

// Elegant light tile layer
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://osm.org/copyright">OSM</a>',
  maxZoom: 19
}).addTo(map);

// Markers layer
let markers = [];
let activeCard = null;
let activeType = 'all';
let activeLevel = 'all';
let currentCity = 'nyc';

function getMarkerColor(type) {
  const colors = {
    grocery: 'marker-grocery',
    restaurant: 'marker-restaurant',
    juice: 'marker-juice',
    cafe: 'marker-cafe'
  };
  return colors[type] || 'marker-grocery';
}

function getMarkerEmoji(type) {
  const emojis = { grocery: '🥬', restaurant: '🍽', juice: '🧃', cafe: '☕' };
  return emojis[type] || '📍';
}

function getBadgeHTML(level) {
  const badges = {
    full: '<span class="organic-badge badge-full">🌿 Fully Organic</span>',
    mostly: '<span class="organic-badge badge-mostly">◐ Mostly Organic</span>',
    some: '<span class="organic-badge badge-some">◔ Organic Options</span>'
  };
  return badges[level] || '';
}

function getLevelLabel(level) {
  return { full: 'Fully Organic', mostly: 'Mostly Organic', some: 'Has Organic Options' }[level] || level;
}

function getTypeLabel(type) {
  return { grocery: 'Grocery Store', restaurant: 'Restaurant', juice: 'Juice Bar', cafe: 'Café' }[type] || type;
}

function daysSince(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / (1000 * 60 * 60 * 24));
}

// ═══════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════
function getFilteredPlaces() {
  return PLACES.filter(p => {
    if (p.city !== currentCity) return false;
    if (activeType !== 'all' && p.type !== activeType) return false;
    if (activeLevel !== 'all' && p.level !== activeLevel) return false;
    // Search filter
    const q = document.getElementById('searchInput').value.toLowerCase();
    if (q) {
      return p.name.toLowerCase().includes(q) ||
             p.neighborhood.toLowerCase().includes(q) ||
             p.notes.toLowerCase().includes(q);
    }
    return true;
  });
}

function renderAll() {
  const filtered = getFilteredPlaces();

  // Clear markers
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  // Update count
  document.getElementById('resultsCount').textContent = `${filtered.length} place${filtered.length !== 1 ? 's' : ''}`;

  // Render cards
  const list = document.getElementById('placeList');
  list.innerHTML = '';

  if (filtered.length === 0) {
    const cityName = CITIES[currentCity].name;
    const emptyEl = document.createElement('div');
    emptyEl.style.cssText = 'padding: 40px 20px; text-align: center;';
    emptyEl.innerHTML = `
      <div style="font-size: 36px; margin-bottom: 12px; opacity: 0.5;">🌿</div>
      <div style="font-family: DM Serif Display, serif; font-size: 18px; margin-bottom: 8px; color: var(--text-primary);">${cityName} — Coming Soon</div>
      <div style="font-size: 13px; color: var(--text-muted); line-height: 1.6; max-width: 280px; margin: 0 auto;">We're curating organic-friendly spots in ${cityName}. Know a great place? Hit <strong>Suggest a Place</strong> to help us build this map.</div>
    `;
    list.appendChild(emptyEl);
    return;
  }

  filtered.sort((a, b) => a.name.localeCompare(b.name)).forEach(place => {
    // Card
    const card = document.createElement('div');
    card.className = 'place-card';
    card.dataset.id = place.id;

    const days = daysSince(place.verified);
    const verifiedClass = days > 90 ? 'stale-dot' : 'verified-dot';
    const verifiedLabel = days > 90 ? `Verified ${days}d ago — may be stale` : `Verified ${days}d ago`;

    card.innerHTML = `
      <div class="place-card-top">
        <div class="place-name">${place.name}</div>
        ${getBadgeHTML(place.level)}
      </div>
      <div class="place-type">${getMarkerEmoji(place.type)} ${getTypeLabel(place.type)}</div>
      <div class="place-address">${place.address}</div>
      <div class="place-notes">"${place.notes.substring(0, 120)}${place.notes.length > 120 ? '...' : ''}"</div>
      <div class="place-meta">
        <span class="place-meta-item"><span class="${verifiedClass}"></span> ${verifiedLabel}</span>
        <span class="place-meta-item">📍 ${place.neighborhood}</span>
      </div>
    `;

    card.addEventListener('click', () => openDetail(place, card));
    list.appendChild(card);

    // Map marker
    const icon = L.divIcon({
      className: '',
      html: `<div class="custom-marker ${getMarkerColor(place.type)}"><span>${getMarkerEmoji(place.type)}</span></div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -34]
    });

    const marker = L.marker([place.lat, place.lng], { icon }).addTo(map);

    marker.bindPopup(`
      <div class="popup-inner">
        <div class="popup-name">${place.name}</div>
        <div class="popup-address">${place.address}</div>
        ${getBadgeHTML(place.level)}
        <div class="popup-notes" style="margin-top:8px">${place.notes.substring(0, 100)}...</div>
        <div class="popup-meta">
          <span>📍 ${place.neighborhood}</span>
          <span>🕐 ${place.hours}</span>
        </div>
      </div>
    `);

    marker.on('click', () => openDetail(place, card));
    markers.push(marker);
  });
}

function openDetail(place, card) {
  // Highlight card
  document.querySelectorAll('.place-card').forEach(c => c.classList.remove('active'));
  if (card) card.classList.add('active');

  // Fill detail panel
  document.getElementById('detailName').textContent = place.name;
  document.getElementById('detailType').textContent = `${getMarkerEmoji(place.type)} ${getTypeLabel(place.type)} — ${place.neighborhood}`;
  document.getElementById('detailBadge').innerHTML = getBadgeHTML(place.level);
  document.getElementById('detailAddress').textContent = place.address;
  document.getElementById('detailNeighborhood').textContent = place.neighborhood;
  document.getElementById('detailNotes').textContent = place.notes;
  document.getElementById('detailHours').textContent = place.hours;

  const days = daysSince(place.verified);
  const freshness = days > 90
    ? `⚠ Last verified ${place.verified} (${days} days ago) — this listing may be out of date`
    : `✓ Verified ${place.verified} (${days} days ago)`;
  document.getElementById('detailVerified').textContent = freshness;

  document.getElementById('detailPanel').classList.add('open');

  // Pan map
  map.panTo([place.lat, place.lng], { animate: true });
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  document.querySelectorAll('.place-card').forEach(c => c.classList.remove('active'));
}

// ═══════════════════════════════════════
//  FILTERS
// ═══════════════════════════════════════
document.getElementById('typeFilters').addEventListener('click', (e) => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('#typeFilters .filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeType = chip.dataset.type;
  closeDetail();
  renderAll();
});

document.getElementById('levelFilters').addEventListener('click', (e) => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('#levelFilters .filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeLevel = chip.dataset.level;
  closeDetail();
  renderAll();
});

// City switcher
document.getElementById('cityBar').addEventListener('click', (e) => {
  const chip = e.target.closest('.city-chip');
  if (!chip) return;
  document.querySelectorAll('.city-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentCity = chip.dataset.city;
  const city = CITIES[currentCity];
  map.setView([city.lat, city.lng], city.zoom, { animate: true });
  closeDetail();
  renderAll();
});

// Search
document.getElementById('searchInput').addEventListener('input', () => {
  closeDetail();
  renderAll();
});

// Stats button
document.getElementById('statsBtn').addEventListener('click', () => {
  const cityPlaces = PLACES.filter(p => p.city === currentCity);
  const full = cityPlaces.filter(p => p.level === 'full').length;
  const mostly = cityPlaces.filter(p => p.level === 'mostly').length;
  const some = cityPlaces.filter(p => p.level === 'some').length;
  const groceries = cityPlaces.filter(p => p.type === 'grocery').length;
  const restaurants = cityPlaces.filter(p => p.type === 'restaurant').length;
  const juices = cityPlaces.filter(p => p.type === 'juice').length;
  const cafes = cityPlaces.filter(p => p.type === 'cafe').length;
  const stale = cityPlaces.filter(p => daysSince(p.verified) > 90).length;

  alert(`PureMap — ${CITIES[currentCity].name} Stats\n\n` +
    `Total Places: ${cityPlaces.length}\n\n` +
    `By Type:\n  🥬 Grocery: ${groceries}\n  🍽 Restaurant: ${restaurants}\n  🧃 Juice Bar: ${juices}\n  ☕ Café: ${cafes}\n\n` +
    `By Organic Level:\n  🌿 Fully Organic: ${full}\n  ◐ Mostly: ${mostly}\n  ◔ Some Options: ${some}\n\n` +
    `⚠ Stale (90+ days): ${stale}`
  );
});

function showAddModal() {
  alert('Suggest a Place feature coming soon!\n\nIn the full version, this will open a form where you can submit a new organic-friendly location for review.');
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
loadPlaces();
